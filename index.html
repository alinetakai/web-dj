<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DJ</title>
    <link rel="shortcut icon" href="favicon-web-dj.png" type="image/png">

    <!--Bootstrap-->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

    <!--p5.js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/p5.js"></script>
    <!--p5 sound-->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.0.0/lib/addons/p5.sound.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/addons/p5.sound.min.js"></script>

    <!--ml5.js-->
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <!--CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h3 class="btn btn-warning heading">
            APP WEB DJ COM IA
            <br>
            <span class="note">
                OBSERVAÇÃO: Mova seu pulso esquerdo para cima e para baixo para controlar o volume.
                Mova seu pulso direito para controlar a velocidade.
            </span>
  	    </h3>

        <div class="controls">

            <div class="speed">
                <img src="disk.gif" class="disk">
                <br>
                <h3 class="btn btn-danger" id="speed">Velocidade</h3>
            </div>

            <div class="volume">
                <img src="disk.gif" class="disk">
                <br>
                <h3 class="btn btn-danger" id="volume">Volume</h3>
            </div>

        </div>

        <button onclick="play();" class="btn btn-success play_button">Reproduzir</button>

        <!-- Área onde o p5.js vai colocar o canvas -->
        <div id="canvas-container"></div>

    </div>

    <script src="main.js"></script>
</body>
</html>
